name: Bootstrap full repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event.head_commit.message == 'chore: bootstrap full repository' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore project files
        shell: bash
        run: |
          cat .bootstrap/part.* | base64 --decode > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit restored repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete AI engineering curriculum"
          git push origin main
