learning_outcomes:
  - Normal equation ve gradient descent ile linear regression geliştirir.
  - MAE, MSE, RMSE, R² ve adjusted R² metriklerini yorumlar.
  - Ridge, Lasso ve Elastic Net modellerini karşılaştırır.
  - Polynomial feature ve regularization ilişkisini değerlendirir.
  - Residual, heteroskedasticity ve multicollinearity analizi uygular.
  - Leakage-safe regresyon pipeline'ı geliştirir.
  - Global ve slice bazlı regresyon raporu üretir.
