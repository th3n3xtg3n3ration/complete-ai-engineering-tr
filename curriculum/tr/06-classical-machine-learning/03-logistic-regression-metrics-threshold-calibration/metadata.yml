learning_outcomes:
  - Sigmoid, log-odds ve cross-entropy ile logistic regression geliştirir.
  - L1/L2 regularization ve class weight seçeneklerini karşılaştırır.
  - Threshold-dependent ve threshold-independent metrikleri ayırır.
  - İş maliyetleri ve guardrail'lerle karar eşiği seçer.
  - Brier score, reliability table ve ECE ile calibration ölçer.
  - Sigmoid ve isotonic probability calibration uygular.
  - Leakage-safe sınıflandırma pipeline'ı geliştirir.
