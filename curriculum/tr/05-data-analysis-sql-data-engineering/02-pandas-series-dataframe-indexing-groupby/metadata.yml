learning_outcomes:
  - Series, DataFrame ve Index hizalama davranışını açıklar.
  - loc, iloc ve boolean mask ile güvenli seçim yapar.
  - Nullable, categorical ve datetime dtype'larını yönetir.
  - GroupBy agg, transform ve filter işlemlerini uygular.
  - Merge kardinalitesini doğrular ve satır çoğalmasını teşhis eder.
  - Eksik ve duplicate veriyi açık iş kurallarıyla işler.
  - Eğitim verisinde fit edilen sızıntısız tabular pipeline geliştirir.
  - pandas ile test edilen analitik veri ürünü oluşturur.
