learning_outcomes:
  - İlişkisel şema, grain, primary key, foreign key ve constraint kavramlarını uygular.
  - SELECT, filtreleme, aggregation ve NULL davranışını doğru kullanır.
  - INNER, LEFT ve anti-join sorgularını kardinalite bilinciyle geliştirir.
  - CTE ile analitik sorguları test edilebilir aşamalara ayırır.
  - ROW_NUMBER, DENSE_RANK, LAG ve kümülatif SUM window function'larını uygular.
  - Parametreli sorgu, transaction ve çıktı kalite kontrolleri kullanır.
