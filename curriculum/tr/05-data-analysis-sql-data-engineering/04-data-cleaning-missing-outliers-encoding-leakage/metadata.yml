learning_outcomes:
  - Veri kalitesini completeness, validity, consistency ve uniqueness boyutlarıyla değerlendirir.
  - Eksik değer mekanizmalarını ve imputation stratejilerini yorumlar.
  - IQR ve robust z-score ile aykırı değerleri teşhis eder.
  - Missing, rare ve unknown kategorileri güvenli biçimde kodlar.
  - Preprocessing istatistiklerini yalnızca eğitim verisinde fit eder.
  - Target, temporal, entity ve preprocessing leakage risklerini denetler.
  - Test edilen sızıntısız tabular preprocessing paketi geliştirir.
