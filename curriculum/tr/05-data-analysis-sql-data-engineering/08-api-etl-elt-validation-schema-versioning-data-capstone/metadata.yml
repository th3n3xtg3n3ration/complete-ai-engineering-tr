learning_outcomes:
  - API kaynaklarında timeout, retry, rate limit ve pagination uygular.
  - Değiştirilemez ve checksum kontrollü raw snapshot üretir.
  - Sürümlü veri sözleşmeleri ve uyumluluk kontrolleri geliştirir.
  - Geçersiz kayıtları ayrıntılı nedenlerle quarantine eder.
  - Idempotent ve incremental warehouse yükleme mantığı kurar.
  - Bronze, silver ve gold katmanlarında lineage oluşturur.
  - Dataset version ve manifest ile tekrarlanabilir veri ürünü yayımlar.
  - Uçtan uca test edilen bir ETL/ELT pipeline'ı geliştirir.
