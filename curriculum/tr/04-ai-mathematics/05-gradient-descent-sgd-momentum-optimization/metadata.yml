learning_outcomes:
  - Gradient descent güncelleme kuralını türevle ilişkilendirir.
  - Batch, stochastic ve mini-batch eğitim stratejilerini karşılaştırır.
  - Momentum, Nesterov, AdaGrad, RMSProp ve Adam algoritmalarını açıklar.
  - Saf Python ile stateful optimizer implementasyonları geliştirir.
  - Learning-rate schedule, gradient clipping ve early stopping uygular.
  - Loss, gradient normu ve update normundan eğitim sorunlarını teşhis eder.
  - Farklı optimizer'ları tekrarlanabilir deneylerle karşılaştırır.
