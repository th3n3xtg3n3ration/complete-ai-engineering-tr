learning_outcomes:
  - Entropi ve surprisal kavramlarını olasılık dağılımlarıyla ilişkilendirir.
  - Cross-entropy ve negative log-likelihood ilişkisini açıklar.
  - KL ve Jensen-Shannon divergence hesaplar ve yorumlar.
  - Softmax, log-softmax ve log-sum-exp işlemlerini sayısal kararlı uygular.
  - Label smoothing, focal loss, Brier score ve calibration kavramlarını karşılaştırır.
  - Saf Python ile çok sınıflı softmax regression modeli geliştirir.
  - Distribution shift sırasında entropy, divergence ve calibration sinyallerini analiz eder.
  - AI matematiği modülündeki kavramları capstone projesinde birleştirir.
