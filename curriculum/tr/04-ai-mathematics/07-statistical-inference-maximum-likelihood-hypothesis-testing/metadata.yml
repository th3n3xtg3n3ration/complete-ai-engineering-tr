learning_outcomes:
  - Population, sample, parameter, statistic ve sampling distribution kavramlarını ayırt eder.
  - Bias, variance, consistency ve standard error üzerinden estimator kalitesini değerlendirir.
  - Analitik ve bootstrap confidence interval üretir ve doğru yorumlar.
  - Bernoulli ve Gaussian modellerinde maximum likelihood estimation uygular.
  - MLE ile MAP tahminini prior etkisi üzerinden karşılaştırır.
  - Hipotez testi, p-value, Type I/II error ve statistical power kavramlarını uygular.
  - Effect size ile statistical ve practical significance ayrımını yapar.
  - Permutation test ve multiple-testing düzeltmelerini saf Python ile geliştirir.
  - A/B testlerinde peeking, sample ratio mismatch ve analysis-unit hatalarını teşhis eder.
